plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localPropertiesFile = rootProject.file("local.properties")
def localProperties = new Properties()
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.sticly'
    compileSdk 35

    defaultConfig {
        applicationId "com.sticly"
        minSdk 24
        targetSdk 35
        versionCode 46
        versionName "4.6.0"

        buildConfigField "String", "DEEPSEEK_API_KEY", "\"${localProperties.getProperty('DEEPSEEK_API_KEY', '')}\""
        buildConfigField "String", "POCKETBASE_URL", "\"${localProperties.getProperty('POCKETBASE_URL', 'NOT_SET')}\""
        buildConfigField "String", "WORKER_URL", "\"${localProperties.getProperty('WORKER_URL', 'NOT_SET')}\""
        buildConfigField "String", "NTFY_URL", "\"${localProperties.getProperty('NTFY_URL', 'NOT_SET')}\""

        // Sadece ARM mimarileri (MediaPipe x86_64 desteklemiyor)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Native debug symbols dahil et (Play Console için)
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += [
            '-Xno-param-assertions',
            '-Xno-call-assertions',
            '-Xno-receiver-assertions'
        ]
    }
    
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            // Android 15 (16KB alignment) ve daha iyi performans için false olmalı
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Shimmer for skeleton loading
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    
    // Unity Ads SDK
    implementation 'com.unity3d.ads:unity-ads:4.12.2'
    
    // Unity Ads Mediation for AdMob
    implementation 'com.google.ads.mediation:unity:4.12.2.0'

    // Google Play Billing
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    // SwipeRefreshLayout (CircularProgressDrawable için)
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ML Kit Subject Segmentation (Background Removal)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

    // uCrop for image cropping
    implementation 'com.github.yalantis:ucrop:2.2.8'

    // Lottie Animation
    implementation 'com.airbnb.android:lottie:6.3.0'

    // PhotoEditor - Professional image editing (Updated to 3.0.1)
    implementation 'com.burhanrashid52:photoeditor:3.0.1'

    // FFmpeg Kit for video/GIF to WebP conversion (local AAR - removed from Maven Central)
    implementation files('libs/ffmpeg-kit-full-gpl-6.0-2.LTS.aar')
    implementation 'com.arthenica:smart-exception-java:0.2.1'

    // ExoPlayer (Media3) for video playback
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-transformer:1.2.1'
    implementation 'androidx.media3:media3-effect:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
}
