plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.sticly'
    compileSdk 35

    defaultConfig {
        applicationId "com.sticly"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName "2.0.2"

        // Sadece ARM mimarileri (MediaPipe x86_64 desteklemiyor)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Native debug symbols dahil et (Play Console için)
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    // Google Play Billing
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'jp.wasabeef:glide-transformations:4.3.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // SwipeRefreshLayout (CircularProgressDrawable için)
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ML Kit Subject Segmentation (Background Removal)
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

    // uCrop for image cropping
    implementation 'com.github.yalantis:ucrop:2.2.8'

    // Lottie Animation
    implementation 'com.airbnb.android:lottie:6.3.0'

    // PhotoEditor - Professional image editing (Updated to 3.0.1)
    implementation 'com.burhanrashid52:photoeditor:3.0.1'

    // FFmpeg Kit for video/GIF to WebP conversion (Temporarily disabled due to dependency issues)
    // implementation 'com.arthenica:ffmpeg-kit-full:4.5'
}
