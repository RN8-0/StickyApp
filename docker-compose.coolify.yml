      VITE_PB_URL: https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io
      VITE_PB_PUBLIC_URL: https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io
      VITE_APP_URL: https://sticky-admin.46.225.95.201.sslip.io
