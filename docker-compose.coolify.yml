      VITE_WORKER_URL: https://sticky-worker.46.225.95.201.sslip.io
      VITE_IMAGE_PROXY_URL: https://sticky-images.46.225.95.201.sslip.io
    labels:
      - traefik.enable=true
      - traefik.http.routers.sticky-admin.rule=Host(`sticky-admin.46.225.95.201.sslip.io`)
      - traefik.http.routers.sticky-admin.entrypoints=https
      - traefik.http.routers.sticky-admin.tls=true
      - traefik.http.routers.sticky-admin.tls.certresolver=letsencrypt
      - traefik.http.services.sticky-admin.loadbalancer.server.port=80

  sticky-worker:
