services:
  sticky-admin:
    build:
      context: ./sticker_admin_web
      dockerfile: Dockerfile
      args:
        VITE_PB_URL: https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io
        VITE_PB_PUBLIC_URL: https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io
        VITE_APP_URL: https://sticky-admin.46.225.95.201.sslip.io
        VITE_OAUTH_REDIRECT_URL: https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io/api/oauth2-redirect
        VITE_WORKER_URL: https://sticky-worker.46.225.95.201.sslip.io
        VITE_IMAGE_PROXY_URL: https://sticky-images.46.225.95.201.sslip.io
