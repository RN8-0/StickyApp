      PORT: 3000
      PB_URL: https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io
      PB_ADMIN_EMAIL: arainunger@gmail.com
      PB_ADMIN_PASS: ${PB_ADMIN_PASS}
      NTFY_URL: https://sticky-ntfy.46.225.95.201.sslip.io
      NTFY_TOPIC: sticky-stickers
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    labels:
      - traefik.enable=true
      - traefik.http.routers.sticky-worker.rule=Host(`sticky-worker.46.225.95.201.sslip.io`)
      - traefik.http.routers.sticky-worker.entrypoints=https
      - traefik.http.routers.sticky-worker.tls=true
      - traefik.http.routers.sticky-worker.tls.certresolver=letsencrypt
      - traefik.http.services.sticky-worker.loadbalancer.server.port=3000
