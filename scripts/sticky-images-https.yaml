http:
  routers:
    sticky-images-https:
      entryPoints:
        - https
      service: sticky-images-svc
      rule: "Host(`sticky-images.46.225.95.201.sslip.io`)"
      tls:
        certresolver: letsencrypt
    sticky-images-http-redirect:
      entryPoints:
        - http
      rule: "Host(`sticky-images.46.225.95.201.sslip.io`)"
      middlewares:
        - sticky-images-redirect-to-https
      service: sticky-images-svc
  services:
    sticky-images-svc:
      loadBalancer:
        servers:
          # Route by Docker DNS container name, not a hardcoded IP. Docker's
          # embedded DNS always resolves this to the container's current IP, so
          # routing survives restarts/redeploys that reshuffle container IPs.
          - url: "http://sticky-images:80"
  middlewares:
    sticky-images-redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true
