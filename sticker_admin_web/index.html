<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Web Admin v2.0 PRO</title>
  <style>
    /* Initial loading state — visible until React mounts */
    #root:empty::after {
      content: '';
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
    }
    #root:empty::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 9999;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Fallback error shown if JS never loads */
    #js-error {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      z-index: 99999;
    }
    #js-error h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    #js-error p { color: #94a3b8; font-size: 0.875rem; max-width: 480px; margin-bottom: 1.5rem; }
    #js-error button {
      padding: 0.625rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      background: #7c3aed;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.875rem;
    }
  </style>
  <script>
    /* Show error if JS bundle fails to load within 12 seconds */
    (function() {
      var timeout = setTimeout(function() {
        var el = document.getElementById('js-error');
        if (el) {
          el.style.display = 'flex';
          document.getElementById('root').style.display = 'none';
        }
      }, 12000);
      /* Clear timeout once React has mounted (root is no longer empty) */
      var observer = new MutationObserver(function() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          clearTimeout(timeout);
          observer.disconnect();
        }
      });
      var rootEl = document.getElementById('root');
      if (rootEl) observer.observe(rootEl, { childList: true });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <div id="js-error">
    <h1>⚠️ Failed to load application</h1>
    <p>The admin panel could not load. This might be due to a network issue or a temporary server problem.</p>
    <button onclick="window.location.reload()">Reload Page</button>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
