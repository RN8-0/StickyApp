server {
    listen 80;
    # Coolify/Traefik handles domain routing and SSL; no host redirect here.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/ to PocketBase.
    location /api/ {
        proxy_pass https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io;
        proxy_http_version 1.1;
        proxy_set_header Host sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # Proxy /worker/ to the public sticky-worker service.
    location /worker/ {
        proxy_pass https://sticky-worker.46.225.95.201.sslip.io/;
        proxy_http_version 1.1;
        proxy_set_header Host sticky-worker.46.225.95.201.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Proxy /images/ to the public sticky-images service. ^~ prevents regex rules from intercepting.
    location ^~ /images/ {
        proxy_pass https://sticky-images.46.225.95.201.sslip.io/;
        proxy_http_version 1.1;
        proxy_set_header Host sticky-images.46.225.95.201.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Static assets — long cache, immutable (content-hashed filenames)
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        try_files $uri =404;
    }

    # SPA routes + index.html — never cache, add COOP/COEP/CSP
    # NOTE: add_header inheritance in nginx requires ALL headers to be listed in
    # each location block that has its own add_header directives.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self' https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io https://sticky-worker.46.225.95.201.sslip.io https://sticky-images.46.225.95.201.sslip.io https://api.deepseek.com https://translate.googleapis.com https://api.giphy.com wss:; media-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self';" always;
        try_files $uri $uri/ /index.html;
    }
}
