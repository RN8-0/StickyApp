server {
    listen 80;
    # Coolify/Traefik handles domain routing and SSL; no host redirect here.
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/ to PocketBase.
    location /api/ {
        proxy_pass https://sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io;
        proxy_http_version 1.1;
        proxy_set_header Host sh3xlf9j7symlj3otlw6s8rx.46.225.95.201.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # Proxy /worker/ to the public sticky-worker service.
    location /worker/ {
        proxy_pass https://sticky-worker.46.225.95.201.sslip.io/;
        proxy_http_version 1.1;
        proxy_set_header Host sticky-worker.46.225.95.201.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Proxy /images/ to the public sticky-images service. ^~ prevents regex rules from intercepting.
    location ^~ /images/ {
        proxy_pass https://sticky-images.46.225.95.201.sslip.io/;
        proxy_http_version 1.1;
        proxy_set_header Host sticky-images.46.225.95.201.sslip.io;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
