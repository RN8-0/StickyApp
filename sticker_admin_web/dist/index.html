<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Web Admin v2.0 PRO</title>
  <style>
    /* Initial loading state — visible until React mounts */
    #root:empty::after {
      content: '';
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
    }
    #root:empty::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      border: 3px solid rgba(124, 58, 237, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      z-index: 9999;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Fallback error shown if JS never loads */
    #js-error {
      display: none;
      position: fixed;
      inset: 0;
      background: #0a0a0f;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      z-index: 99999;
    }
    #js-error h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    #js-error p { color: #94a3b8; font-size: 0.875rem; max-width: 480px; margin-bottom: 1.5rem; }
    #js-error button {
      padding: 0.625rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      background: #7c3aed;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.875rem;
    }
  </style>
  <script type="module" crossorigin src="/static/index-z-92tx-8.js"></script>
  <link rel="stylesheet" crossorigin href="/static/index-l_ejFL0F.css">
</head>

<body>
  <div id="root"></div>
  <div id="js-error">
    <h1>&#9888;&#65039; Failed to load application</h1>
    <p>The admin panel could not load. This might be due to a network issue or a temporary server problem.</p>
    <button onclick="window.location.reload()">Reload Page</button>
  </div>
  <script>
    (function() {
      /* Unregister ALL service workers on every load.
         After unregistering, the SW list is empty — no reload loop.
         We only reload when we actually removed something. */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          if (regs.length > 0) {
            Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
              window.location.replace(window.location.href);
            });
          }
        });
      }
      /* Auto-retry once if React doesn't mount in 15 seconds, then show error */
      var retried = sessionStorage.getItem('_loadRetry') === '1';
      var timeout = setTimeout(function() {
        var rootEl = document.getElementById('root');
        if (!rootEl || rootEl.children.length === 0) {
          if (!retried) {
            sessionStorage.setItem('_loadRetry', '1');
            window.location.replace(window.location.href);
          } else {
            sessionStorage.removeItem('_loadRetry');
            var el = document.getElementById('js-error');
            if (el) { el.style.display = 'flex'; }
          }
        }
      }, 15000);
      /* Clear timeout once React has mounted (root has children) */
      var rootEl = document.getElementById('root');
      if (rootEl) {
        var observer = new MutationObserver(function() {
          if (rootEl.children.length > 0) {
            clearTimeout(timeout);
            sessionStorage.removeItem('_loadRetry');
            observer.disconnect();
          }
        });
        observer.observe(rootEl, { childList: true });
      }
    })();
  </script>
</body>

</html>
